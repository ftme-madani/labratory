<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B192C"/>
      <stop offset="50%" stop-color="#1E3E62"/>
      <stop offset="100%" stop-color="#040D1A"/>
    </linearGradient>
    <linearGradient id="liquidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00D2FC"/>
      <stop offset="100%" stop-color="#0077B6"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Orbital Rings -->
  <ellipse cx="256" cy="270" rx="160" ry="60" fill="none" stroke="#38BDF8" stroke-width="4" stroke-dasharray="8 6" opacity="0.4" transform="rotate(-25 256 270)"/>
  <ellipse cx="256" cy="270" rx="160" ry="60" fill="none" stroke="#2DD4BF" stroke-width="4" stroke-dasharray="8 6" opacity="0.4" transform="rotate(25 256 270)"/>

  <!-- Lab Flask Glass Outline -->
  <path d="M226 130 L226 210 L145 345 C132 367 148 395 174 395 L338 395 C364 395 380 367 367 345 L286 210 L286 130" 
        fill="none" stroke="#94A3B8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Flask Lip -->
  <rect x="214" y="118" width="84" height="14" rx="7" fill="#94A3B8"/>

  <!-- Liquid inside Flask -->
  <path d="M172 340 L160 360 C154 370 162 383 174 383 L338 383 C350 383 358 370 352 360 L340 340 Q300 355 256 345 Q212 335 172 340 Z" 
        fill="url(#liquidGrad)" opacity="0.9" filter="url(#glow)"/>

  <!-- Liquid bubbles -->
  <circle cx="230" cy="355" r="7" fill="#E0F2FE" opacity="0.8"/>
  <circle cx="280" cy="345" r="10" fill="#E0F2FE" opacity="0.7"/>
  <circle cx="250" cy="325" r="5" fill="#E0F2FE" opacity="0.9"/>
  <circle cx="265" cy="290" r="4" fill="#38BDF8" opacity="0.8"/>
  <circle cx="240" cy="265" r="3" fill="#2DD4BF" opacity="0.8"/>

  <!-- Atom Sparkle / Star -->
  <polygon points="256,70 262,88 280,94 262,100 256,118 250,100 232,94 250,88" fill="#F8FAFC" filter="url(#glow)"/>
</svg>
